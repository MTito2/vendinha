<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Alerta de Estoque</title>

    <style>
        body {
            margin: 0;
            background-color: #f5f7fa;
            font-family: "Istok Web", Arial, sans-serif;
            color: #464d5c;
        }

        .container {
            width: 100%;
            height: 80vh;
            background: #ffffff;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        .header {
            background: #007D78;
            padding: 24px 32px;
            border-bottom: 6px solid #FFC000;
        }

            .header h1 {
                margin: 0;
                color: white;
                font-size: 22px;
                font-weight: 700;
            }

        .content {
            padding: 32px;
        }

        .text {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .stock-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .stock-item {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-left: 5px solid #FFC000;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 12px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 700;
            color: #3f4146;
        }

        .product-info {
            font-size: 12px;
            margin-top: 4px;
            color: #6b7280;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #8a8f99;
        }

        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 24px;
            background: #007D78;
            color: white !important;
            text-decoration: none;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .alert-icon {
            font-size: 20px;
            margin-right: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Alerta Diário de Estoque Crítico</h1>
        </div>

        <div class="content">

            <div class="text">
                Olá equipe,
                <br><br>
                Os produtos abaixo estão com estoque crítico e precisam de reposição.
            </div>

            <ul class="stock-list">
                {{ProductList}}
            </ul>

            <a href="www.vendinha-solidaria.com.br/pages/admin/login.html" class="btn">
                Acessar Sistema
            </a>

            <div class="footer">
                Este é um alerta automático enviado pela Vendinha.
            </div>

        </div>

    </div>

</body>
</html>
