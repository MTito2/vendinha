<head>

    <link rel="icon" type="image/svg+xml" href="/assets/imgs/favicon.svg" />
    <link rel="shortcut icon" href="/assets/imgs/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/imgs/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&family=Itim&family=Orbitron:wght@400..900&family=Rammetto+One&family=Work+Sans:ital,wght@0,100..900;1,100..900&family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap"

<body class="protected-page">
    <header>
        <nav class="navbar navbar-expand-lg px-3 px-md-4 navbar-options navbar-dark">

            <div class="container-fluid">
                <a class="navbar-brand" href="/pages/admin/home.html">
                    <img class="img-vale" src="/assets/imgs/logo-vale-white.png" alt="Logo">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav"
                    aria-controls="menuNavegacao" aria-expanded="false" aria-label="Alternar navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuNav">
                    <div class="navbar-nav ms-auto gap-2 gap-md-4 ">
                        <a class="nav-link option" href="#">Produtos</a>
                        <a class="nav-link option" href="/pages/admin/inflows_history.html">Entradas</a>
                        <a class="nav-link option" href="/pages/admin/outflows.html">Saídas</a>
                        <a class="nav-link option" href="/pages/admin/place_history.html">Locais</a>
                        <a class="nav-link option" href="/pages/admin/nfs.html">N.Fs</a>
                        <a class="nav-link option" id="menu-users" href="/pages/admin/users.html">Usuários</a>
                        <li class="nav-item dropdown">
                            <a id="username-display" class="nav-link option dropdown-toggle small" href="#"
                                role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            </a>

                            <ul class="dropdown-menu dropdown-menu-end small">
                                <li><a id="btn-edit-profile" class="dropdown-item py-1" href="#">Editar Perfil</a></li>
                                <li>
                                    <hr class="dropdown-divider my-1">
                                </li>
                                <li><a class="dropdown-item text-danger py-1" href="#" id="btn-logout">Sair</a></li>
                            </ul>
                        </li>
                    </div>
                </div>

            </div>
        </nav>
    </header>
    <main class="d-flex align-items-center justify-content-start flex-column">

        <h1 class="fw-bold h5 my-4">Cadastrar Usuário</h1>

        <div class="gap-4 w-100 d-flex flex-column align-items-center justify-content-center mt-5">
            <input id="input-username" name="user_register_username" class="input w-75" type="text"
                placeholder="Nome de Usuário" autocomplete="username">

            <input id="input-email" name="user_register_email" class="input w-75" type="email" placeholder="Email"
                autocomplete="email">
            <input id="input-password" name="user_register_password" class="input w-75" type="password"
                placeholder="Senha" autocomplete="new-password">

            <div class="d-flex gap-4">
                <a class="btn-green" href="/pages/admin/users.html">Cancelar</a>
                <a class="btn-green" id="btn-send" href="#">Cadastrar</a>
            </div>
        </div>

    </main>

    <script src="/js/config.js"></script>
    <script src="/js/libs/bootstrap.bundle.min.js"> </script>
    <script src="/js/libs/tablesort.min.js"></script>
    <script src="/js/libs/tablesort.number.js"></script>

    <script type="module" src="/js/auth-guard.js"></script>
