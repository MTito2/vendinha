</head>

<body class="protected-page">
    <header>
        <nav class="navbar navbar-expand-lg px-3 px-md-4 navbar-options navbar-dark">

            <div class="container-fluid">
                <a class="navbar-brand" href="/pages/admin/home.html">
                    <img class="img-vale" src="/assets/imgs/logo-vale-white.png" alt="Logo">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav"
                    aria-controls="menuNavegacao" aria-expanded="false" aria-label="Alternar navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuNav">
                    <div class="navbar-nav ms-auto gap-2 gap-md-4 ">
                        <a class="nav-link option" href="/pages/admin/products_adm.html">Produtos</a>
                        <a class="nav-link option" href="/pages/admin/inflows_history.html">Entradas</a>
                        <a class="nav-link option" href="/pages/admin/outflows.html">Saídas</a>
                        <a class="nav-link option" href="/pages/admin/stock.html">Estoque</a>
                        <a class="nav-link option" href="/pages/admin/place_history.html">Locais</a>
                        <a class="nav-link option" href="/pages/admin/nfs.html">N.Fs</a>
                        <a class="nav-link option" id="menu-users" href="/pages/admin/users.html">Usuários</a>
                                <li class="nav-item dropdown">
                            <a id="username-display" class="nav-link option dropdown-toggle small" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            </a>

                            <ul class="dropdown-menu dropdown-menu-end small">
                                <li><a id="btn-edit-profile" class="dropdown-item py-1" href="#">Editar Perfil</a></li>
                                <li>
                                    <hr class="dropdown-divider my-1">

                        </li>
                    </div>

            </div>
        </nav>
    </header>

    <main class="d-flex align-items-center flex-column position-relative">

        <h1 class="fw-bold h5 my-4">Notas</h1>

        <div class="icons-container">
            <div>
                <button type="button" id="btn-download-selected" class="btn-download">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="#464d5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-arrow-down-to-line-icon lucide-arrow-down-to-line">
                        <path d="M12 17V3" />
                        <path d="m6 11 6 6 6-6" />
                        <path d="M19 21H5" />
                    </svg>
                    Baixar
                </button>
            </div>

            <div>
                <button type="button" id="btn-delete-selected" class="btn-trash">
                    <svg class="icon-trash" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="#464d5c" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M10 11v6" />
                        <path d="M14 11v6" />
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                        <path d="M3 6h18" />
                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    </svg>
                    Excluir
                </button>
            </div>
        </div>


        <div class="table-container mb-5 d-flex flex-column align-items-center">
            <table id="table" class="table text-center">
                <thead class="table-light sticky-top">
                    <tr>
                        <th data-sort-method="none" width="100" scope="col"><input type="checkbox"
                                class="form-check-input" id="check-all"></th>
                        <th scope="col" width="100">Data</th>
                        <th scope="col" width="300">Arquivo</th>
                        <th scope="col" width="100">Tipo</th>
                        <th scope="col" width="100">Valor</th>
                        <th data-sort-method="none" width="80" scope="col"></th>
                    </tr>
                </thead>
            </table>
        </div>

        <button type="button" id="btn-add-invoice" class="btn-green" data-bs-toggle="modal"
            data-bs-target="#modalInvoice">
            Adicionar Nota Fiscal
        </button>

        <div id="liveAlertPlaceholder" class="mt-3"></div>

        <div class="modal fade" id="modalInvoice" tabindex="-1" aria-labelledby="modalInvoiceLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                    <form id="formInvoice">

                        <div class="modal-header">
                            <h5 class="modal-title" id="modalInvoiceLabel">Nova Nota Fiscal</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body">
                            <input type="hidden" id="invoiceId" name="invoiceId">

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="invoiceDate" class="form-label">Data de Emissão</label>
                                    <input type="text" class="form-control" id="invoiceDate" name="invoiceDate"
                                        placeholder="Selecione a data" autocomplete="off" required>
                                </div>

                                <div class="col-12">
                                    <label for="invoiceDesc" class="form-label">Descrição</label>
                                    <input class="form-control" type="text" id="invoiceDesc" name="invoiceDesc"
                                        placeholder="Ex: Nota de compra" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="invoiceType" class="form-label">Tipo de Nota</label>
                                    <select class="form-select" id="invoiceType" name="invoiceType" required>
                                        <option value="" selected disabled>Selecione...</option>
                                        <option value="Entrada">Entrada</option>
                                        <option value="Saida">Saída</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="invoiceValue" class="form-label">Valor (R$)</label>
                                    <input type="number" step="0.01" min="0" class="form-control" id="invoiceValue"
                                        name="invoiceValue" placeholder="0,00" required>
                                </div>

                                <div class="col-12">
                                    <label for="invoiceFile" class="form-label">Arquivo (PDF)</label>
                                    <input class="form-control" type="file" id="invoiceFile" name="invoiceFile"
                                        accept=".pdf" required>
                                </div>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-success border-0 rounded px-3 py-2">Salvar
                                Nota</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>

        <div class="modal fade" id="modalDeleteConfirm" tabindex="-1" aria-labelledby="modalDeleteConfirmLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-sm modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title h6" id="modalDeleteConfirmLabel">Confirmar Exclusão</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-center py-4">
                        <p class="mb-0 text-muted">Tem certeza que deseja excluir? Esta ação não poderá
                            ser desfeita.</p>
                    </div>
                    <div class="modal-footer justify-content-center border-0 pt-0">
                        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" id="btn-confirm-delete-action"
                            class="btn btn-danger px-4">Excluir</button>
                    </div>
                </div>
            </div>
        </div>

    </main>
