<body class="d-flex flex-column app-body">
    <header class="header w-100 d-flex flex-column">
        <h1 class="title text-center fw-bold m-0">Vendinha Solidária</h1>
        <p class="subtitle fw-bold text-center">DBPG - Complexo Mariana</p>

            <h3 id="title-total-price" class="h5">R$ </h3>
        </div>

        <p class="division mb-4"></p>

                    <h6 class="mb-0 fw-semibold">Pix Copia e Cola</h6>
                </div>
            </div>

            <div class="d-flex flex-column gap-2">

                <div class="d-flex gap-3 align-items-start">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">

                </div>

                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">

                </div>

                <div class="d-flex gap-3 align-items-start">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                        <path fill="#007D78"
                            d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75s-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12m11.056-3.8a.75.75 0 1 0-1.445-.4c-.383 1.377-1.16 2.668-1.863 3.633a16 16 0 0 1-1.185 1.44l-.072.075l-.018.018l-.004.004a.75.75 0 0 0 .531 1.28h3V16a.75.75 0 0 0 1.5 0v-1.75h.5a.75.75 0 0 0 0-1.5h-.5V12a.75.75 0 0 0-1.5 0v.75h-1.366q.159-.203.326-.433c.755-1.035 1.645-2.494 2.096-4.116" />
